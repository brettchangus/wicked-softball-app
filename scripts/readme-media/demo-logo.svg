    <radialGradient id="face" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff3b57"/>
      <stop offset=".55" stop-color="#c41230"/>
      <stop offset="1" stop-color="#5e0716"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#e0a526"/>
    </linearGradient>
  </defs>
  <circle cx="300" cy="300" r="290" fill="#111"/>
  <circle cx="300" cy="300" r="268" fill="url(#face)"/>
  <circle cx="300" cy="300" r="268" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <!-- softball seams -->
